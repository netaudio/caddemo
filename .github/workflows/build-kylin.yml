name: Build Linux (Kylin V10 桌面版)

# 目标：编出能在银河麒麟桌面操作系统 V10 SP1（真机 + QEMU 虚拟机）上运行的产物。
#
# ── 麒麟 V10 SP1 实测环境（2026-11 于 arm64 QEMU 虚拟机验证）──────────────
#   · glibc 2.28（多架构统一；此前注释误写 2.31 —— 麒麟底层是 RHEL8/
#     openEuler 系而非 Ubuntu 系，只是包管理沿用 apt）
#   · 系统 GCC 7.3 → GLIBCXX 上限 3.4.24
#   · arm64 内核内存页 64K（getconf PAGE_SIZE = 65536）
#   · 系统自带 Qt5：arm64 5.12+ / x86_64 5.15.2（库均为 64K 对齐）
#
# ── 构建环境：ubuntu:18.04（bionic）──────────────────────────────────────
#   glibc 2.27 ≤ 2.28（留一版余量）、gcc 7.5 → 产物最高 GLIBCXX_3.4.24
#   与麒麟精确匹配。此前用 ubuntu:20.04（glibc 2.31）构建，产物在麒麟
#   真机上报 "GLIBC_2.29 not found"，已在 2026-11 修正。
#
# ── 64K 内存页（arm64 报错主因）─────────────────────────────────────────
#   Linux 要求 ELF 每个 LOAD 段对齐值 ≥ 内核页大小。发行版/官方 Qt 库
#   （Ubuntu focal、aqtinstall 产物）都是 4K 对齐，在 64K 页内核上动态
#   加载器直接拒绝 —— 与 LD_LIBRARY_PATH 无关。因此：
#   1. 可执行文件用 -z max-page-size=65536 链接（64K 对齐）。
#      64K 对齐产物在 4K 页环境同样合法 —— 一包同时支持真机与虚拟机。
#   2. SHIP_QT=0 不随包携带任何 Qt/ICU/插件，运行时用目标机系统 Qt
#      （麒麟自带，64K 对齐、glibc/GLIBCXX 天然匹配）。
#      构建用 bionic 的 Qt 5.9.5 头文件：Qt minor 版本向后兼容，
#      5.9 编译产物可在 5.12/5.15 运行时上运行；代码已做全 Qt5 兼容
#      （kSkipEmptyParts / idClicked / globalPosition 均条件编译）。

on:
  push:
    # branches: [ main, master ]   # 平时 push 不自动编译；需要时取消注释即可
    tags: [ 'v*' ]   # 打版本 tag 时触发编译 + 发 Release
  pull_request:
  workflow_dispatch:
    inputs:
      build_x64:
        description: '同时构建 x86_64 版本（默认只编 arm64）'
        type: boolean
        default: false

env:
  QT_MAJOR: "5"
  # 目标机能力上限（麒麟 V10 SP1 实测，多架构一致）
  KYLIN_MAX_GLIBC: "GLIBC_2.28"
  KYLIN_MAX_GLIBCXX: "GLIBCXX_3.4.24"

jobs:
  # =========================================================================
  # 日常构建：GitHub 托管 runner + Ubuntu 18.04 容器（glibc 2.27 ≤ 麒麟 2.28）。
  # =========================================================================
  kylin-x86_64:
    name: 麒麟 V10 SP1 · x86_64（托管）
    runs-on: ubuntu-22.04
    # ── x86_64 开关 ───────────────────────────────────────────────────────
    # 平时默认只编 arm64。需要 x86_64 时两种方式：
    #   1. 单次：手动触发（workflow_dispatch）勾选 build_x64；
    #   2. 持久：仓库 Settings → Secrets and variables → Actions →
    #      Variables 新建 BUILD_X64 = true（对 push / tag 均生效），
    #      不需要时删除该变量即可。
    if: inputs.build_x64 == true || vars.BUILD_X64 == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: 容器内构建（Ubuntu 18.04 / glibc 2.27，系统 Qt 编译）
        run: |
          docker run --rm \
            -v "$PWD":/src \
            -w /src \
            -e QT_MAJOR="5" \
            -e PREFIX=/src/dist/linux-kylin-x64 \
            -e BUILD_DIR=/src/build/linux-kylin-x64 \
            -e SHIP_QT=0 \
            -e PAGE_ALIGN_64K=1 \
            ubuntu:18.04 \
            bash -c "bash scripts/setup_ubuntu1804.sh \
              && apt-get update && apt-get install -y --no-install-recommends qtbase5-dev qtbase5-dev-tools qt5-default \
              && rm -rf /var/lib/apt/lists/* \
              && bash scripts/build_linux.sh"
          sudo chown -R "$(id -u):$(id -g)" dist build 2>/dev/null || true

      - name: 校验兼容性（GLIBC ≤ 2.28 / GLIBCXX ≤ 3.4.24 / 64K 页对齐 / 无内置 Qt）
        run: |
          BIN=dist/linux-kylin-x64/bin

          check_max() {
            local file="$1" pattern="$2" limit="$3" label="$4"
            local actual
            actual=$(objdump -T "$file" | grep -o "$pattern" | sort -uV | tail -1)
            echo "$label 实际最高：${actual:-none}（上限 ${limit}）"
            if [ -n "$actual" ] && \
               [ "$(printf '%s\n%s\n' "$actual" "$limit" | sort -V | tail -1)" != "$limit" ]; then
              echo "::error::$label 需要 $actual，超出麒麟 V10 SP1 的 $limit"
              return 1
            fi
          }

          check_max "$BIN/caddemo" 'GLIBC_[0-9.]*'   "${KYLIN_MAX_GLIBC}"   "caddemo GLIBC"
          check_max "$BIN/caddemo" 'GLIBCXX_[0-9.]*' "${KYLIN_MAX_GLIBCXX}" "caddemo GLIBCXX"

          # LOAD 段最小对齐 ≥ 64K（64K 页内核硬要求；4K 页环境不受影响）
          min_align=999999999
          for a in $(readelf -lW "$BIN/caddemo" | awk '$1=="LOAD"{print $NF}'); do
            v=$(( 16#${a#0x} ))
            if [ "$v" -lt "$min_align" ]; then min_align=$v; fi
          done
          echo "caddemo LOAD 段最小对齐：0x$(printf '%x' "$min_align")（要求 ≥ 0x10000）"
          [ "$min_align" -ge 65536 ] || {
            echo "::error::LOAD 段对齐不足 64K，麒麟 arm64 将拒绝加载"
            exit 1
          }

          # SHIP_QT=0：确认 bin/ 里没有打包的 Qt/ICU（目标机用系统 Qt）
          if ls "$BIN"/libQt*.so.* "$BIN"/libicu*.so.* >/dev/null 2>&1; then
            echo "::error::SHIP_QT=0 但 bin/ 仍含 Qt/ICU 库"
            exit 1
          fi
          echo "✅ x86_64 产物兼容麒麟 V10 SP1（真机/虚拟机均适用）"

      # ── 冒烟测试：暂时停用 ─────────────────────────────────────────────
      # 需要时取消注释即可恢复。
      # - name: 冒烟测试（offscreen，无需 X 服务）
      #   run: |
      #     cd dist/linux-kylin-x64/bin
      #     QT_QPA_PLATFORM=offscreen ./caddemo --selftest
      #     echo "✅ selftest 正常退出"

      # 上传解压后的目录：artifact 下载必然被 GitHub 套一层 zip，
      # 放目录进去，下载方解压一次即可运行，无需再 tar -xzf。
      # 原版 tar.gz 由 Release job 提供（打 tag 时，见下方 release job）。
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: caddemo-kylin-v10sp1-x86_64
          path: dist/linux-kylin-x64
          retention-days: 14

      - name: 保留构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-x64
          path: |
            build/linux-kylin-x64/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7

  # =========================================================================
  # ARM64 构建：GitHub 托管 runner 只有 x86_64，用 QEMU 跑 arm64 容器。
  #
  # ── 为什么 arm64 用 ubuntu:18.04 + 系统 Qt 5.9.5 编译 ─────────────────
  #   aqtinstall 没有 linux/arm64 桌面包；且打包任何发行版 Qt 库都会踩
  #   麒麟 arm64 的 64K 内存页（发行版库全是 4K 对齐，64K 内核拒绝加载）。
  #   故 SHIP_QT=0：Qt/ICU/插件全部不打包，运行时用麒麟自带的系统 Qt
  #   （64K 对齐、glibc 匹配）。构建用 bionic 源的 qtbase5-dev 5.9.5
  #   头文件，Qt minor 向后兼容保证 5.9 编译产物可在麒麟 5.12/5.15 运行。
  #
  # ── 兼容性交验为什么在容器内做 ─────────────────────────────────────────
  #   x86_64 主机的 objdump/readelf 读不了 arm64 ELF（binutils 只配了
  #   本机 target），所以在构建容器内顺手完成校验。
  # =========================================================================
  kylin-arm64:
    name: 麒麟 V10 SP1 · arm64（托管）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 启用 QEMU（arm64 模拟）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 容器内构建 + 校验（Ubuntu 18.04 arm64 / glibc 2.27 / Qt 5.9.5 头文件 / 64K 对齐）
        run: |
          mkdir -p build
          set +e
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/src \
            -w /src \
            -e QT_MAJOR="5" \
            -e PREFIX=/src/dist/linux-kylin-arm64 \
            -e BUILD_DIR=/src/build/linux-kylin-arm64 \
            -e SHIP_QT=0 \
            -e PAGE_ALIGN_64K=1 \
            ubuntu:18.04 \
            bash -c "
              set -euo pipefail
              bash scripts/setup_ubuntu1804.sh
              apt-get update
              # qt5-default：bionic 的 qmake 是 qtchooser shim，必须显式
              # 设置默认 Qt 版本，否则 qmake -query 找不到 Qt 安装
              apt-get install -y --no-install-recommends qtbase5-dev qtbase5-dev-tools qt5-default
              rm -rf /var/lib/apt/lists/*
              echo '==> 系统 Qt5 版本：'\$(qmake -query QT_VERSION)
              bash scripts/build_linux.sh

              BIN=/src/dist/linux-kylin-arm64/bin
              check_max() {
                local file=\"\$1\" pattern=\"\$2\" limit=\"\$3\" label=\"\$4\"
                local actual
                actual=\$(objdump -T \"\$file\" | grep -o \"\$pattern\" | sort -uV | tail -1)
                echo \"\$label 实际最高：\${actual:-none}（上限 \$limit）\"
                if [ -n \"\$actual\" ] && \
                   [ \"\$(printf '%s\n%s\n' \"\$actual\" \"\$limit\" | sort -V | tail -1)\" != \"\$limit\" ]; then
                  echo \"::error::\$label 需要 \$actual，超出麒麟 V10 SP1 的 \$limit\"
                  return 1
                fi
              }
              check_max \"\$BIN/caddemo\" 'GLIBC_[0-9.]*'   '${KYLIN_MAX_GLIBC}'   'caddemo GLIBC'
              check_max \"\$BIN/caddemo\" 'GLIBCXX_[0-9.]*' '${KYLIN_MAX_GLIBCXX}' 'caddemo GLIBCXX'

              min_align=999999999
              for a in \$(readelf -lW \"\$BIN/caddemo\" | awk '\$1==\"LOAD\"{print \$NF}'); do
                v=\$(( 16#\${a#0x} ))
                if [ \"\$v\" -lt \"\$min_align\" ]; then min_align=\$v; fi
              done
              echo \"caddemo LOAD 段最小对齐：0x\$(printf '%x' \"\$min_align\")（要求 ≥ 0x10000，64K 页内核硬要求）\"
              [ \"\$min_align\" -ge 65536 ] || {
                echo \"::error::LOAD 段对齐不足 64K，麒麟 arm64 将拒绝加载\"
                exit 1
              }

              if ls \"\$BIN\"/libQt*.so.* \"\$BIN\"/libicu*.so.* >/dev/null 2>&1; then
                echo \"::error::SHIP_QT=0 但 bin/ 仍含 Qt/ICU 库（4K 对齐库在 64K 页内核上无法加载）\"
                exit 1
              fi
              echo '✅ arm64 产物兼容麒麟 V10 SP1（64K 页真机 / 4K 页环境 / QEMU 虚拟机均适用）'
            " 2>&1 | tee build/arm64-build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            {
              echo '## arm64 构建失败'
              echo '```'
              tail -n 80 build/arm64-build.log || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # 再打成一条 error 注解：annotations 接口可匿名读取，便于无 token 诊断
            msg=$(tail -n 60 build/arm64-build.log | tr -d '\r' \
                  | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-12000)
            echo "::error title=arm64-build::$msg"
            exit "$rc"
          fi
          sudo chown -R "$(id -u):$(id -g)" dist build 2>/dev/null || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: caddemo-kylin-v10sp1-arm64
          path: dist/linux-kylin-arm64
          retention-days: 14

      - name: 保留构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-arm64
          path: |
            build/linux-kylin-arm64/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7

  # =========================================================================
  # 发版：打 tag（如 v0.1.0）时，把双平台 tar.gz 原样挂到 GitHub Release。
  #
  # ── 为什么需要这个 job ─────────────────────────────────────────────────
  #   artifact 下载必然被 GitHub 套一层 zip；Release 附件才是原始文件，
  #   从 Release 页面下载的 tar.gz 与构建产物逐字节一致。
  #
  # ── 为什么重新 chmod +x ────────────────────────────────────────────────
  #   artifact 的 zip 不保留 Unix 执行位，下载后必须恢复 caddemo 与
  #   run-caddemo.sh 的执行权限，否则 tar.gz 里的文件不可执行。
  # =========================================================================
  release:
    name: 发布 GitHub Release
    # x86_64 关闭时该 job 为 skipped；needs 里出现 skipped 默认会连带
    # 跳过本 job，所以用 always() 显式判定：arm64 必须成功，x64 不失败即可。
    if: >-
      always() && !cancelled() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.kylin-arm64.result == 'success' &&
      needs.kylin-x86_64.result != 'failure'
    needs: [kylin-x86_64, kylin-arm64]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 下载双平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: caddemo-kylin-v10sp1-*
          merge-multiple: false

      - name: 恢复执行位并打包 tar.gz
        run: |
          assets=""
          for d in caddemo-kylin-v10sp1-x86_64 caddemo-kylin-v10sp1-arm64; do
            [ -d "$d" ] || { echo "==> 跳过 ${d}（本次未构建）"; continue; }
            chmod +x "$d/bin/caddemo" "$d/bin/run-caddemo.sh"
            tar -czf "${d}.tar.gz" -C "$d" .
            echo "==> ${d}.tar.gz（$(du -h ${d}.tar.gz | cut -f1)）"
            assets="$assets ${d}.tar.gz"
          done
          echo "ASSETS=$assets" >> "$GITHUB_ENV"

      - name: 创建 Release 并上传附件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --repo 显式指定：本 job 无 checkout，工作目录不是 git 仓库，
          # gh 无法自行推断仓库上下文
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" \
            $ASSETS \
            --repo "${{ github.repository }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  # =========================================================================
  # 发版前最终验证：跑在真实的麒麟机器上（self-hosted runner）。
  # 环境与目标机 100% 相同，可用系统 Qt5 与真实 X 会话做 GUI 验证。
  #
  # 需要先在麒麟机器上安装 runner 并打标签 kylin：
  #   1) 仓库 Settings → Actions → Runners → New self-hosted runner → Linux x64
  #   2) 按页面提示下载并 ./config.sh --labels kylin
  #   3) sudo ./svc.sh install && sudo ./svc.sh start
  #
  # 未配置 runner 时该 job 会一直停在 Queued；此时可先把下面整段注释掉。
  # =========================================================================
  kylin-native:
    name: 麒麟 V10 SP1 · x86_64（本机验证）
    runs-on: [self-hosted, kylin]
    # 只在打 tag 或手动触发时跑，避免日常 push 长期占队
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: 环境自检
        run: |
          echo "系统   : $(. /etc/os-release && echo "$PRETTY_NAME")"
          echo "glibc  : $(ldd --version | head -1 | awk '{print $NF}')"
          echo "gcc    : $(gcc --version | head -1)"
          echo "libstdc++: $(strings /usr/lib64/libstdc++.so.6 2>/dev/null \
                        || strings /usr/lib/x86_64-linux-gnu/libstdc++.so.6 2>/dev/null \
                        | grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -1)"
          (qmake -v || qmake-qt5 -v) 2>/dev/null | tail -2 || {
            echo "::error::未找到系统 Qt5，请先执行 sudo apt install qtbase5-dev"
            exit 1
          }
          cmake --version | head -1

      - name: 构建（系统 Qt 5.15.2）
        env:
          QT_MAJOR: "5"
          PREFIX: ${{ github.workspace }}/dist/linux-kylin-native
          BUILD_DIR: ${{ github.workspace }}/build/linux-kylin-native
        run: bash scripts/build_linux.sh

      - name: 冒烟测试（优先真实 X，回退 offscreen）
        run: |
          cd dist/linux-kylin-native/bin
          if [ -n "${DISPLAY:-}" ]; then
            echo "使用已有 DISPLAY=$DISPLAY"
            ./caddemo --selftest
          elif command -v xvfb-run >/dev/null 2>&1; then
            echo "使用 xvfb-run 虚拟显示"
            xvfb-run -a ./caddemo --selftest
          else
            echo "无 X 环境，使用 offscreen"
            QT_QPA_PLATFORM=offscreen ./caddemo --selftest
          fi
          echo "✅ 麒麟本机 selftest 通过"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: caddemo-kylin-native-x86_64
          path: dist/linux-kylin-native.tar.gz
          retention-days: 30
